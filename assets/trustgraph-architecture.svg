<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090417" />
      <stop offset="50%" stop-color="#12082b" />
      <stop offset="100%" stop-color="#070312" />
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f0d2b" />
    </linearGradient>

    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#13082a" />
    </linearGradient>

    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#062e24" />
    </linearGradient>

    <linearGradient id="nodeGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#240e4f" />
    </linearGradient>

    <linearGradient id="nodeGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#07273b" />
    </linearGradient>

    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="25%" stop-color="#836EF9" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="75%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="boxGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.51  0 0 0 0 0.43  0 0 0 0 0.98  0 0 0 0.35 0" />
      <feComposite in="SourceGraphic" operator="over" />
    </filter>
  </defs>

  <style>
    .track-line {
      stroke-dasharray: 6 6;
      animation: pipeFlow 20s linear infinite;
    }
    .energy-packet-1 {
      animation: packet1 4s ease-in-out infinite;
    }
    .energy-packet-2 {
      animation: packet2 4s ease-in-out infinite 1s;
    }
    .energy-packet-3 {
      animation: packet3 4s ease-in-out infinite 2s;
    }
    .energy-packet-4 {
      animation: packet4 4s ease-in-out infinite 3s;
    }
    .node-pulse {
      animation: nodePulse 3s ease-in-out infinite alternate;
    }

    @keyframes pipeFlow {
      to { stroke-dashoffset: -400; }
    }
    @keyframes packet1 {
      0%   { transform: translate(160px, 140px); opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translate(360px, 140px); opacity: 0; }
    }
    @keyframes packet2 {
      0%   { transform: translate(380px, 140px); opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translate(600px, 140px); opacity: 0; }
    }
    @keyframes packet3 {
      0%   { transform: translate(620px, 140px); opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translate(840px, 140px); opacity: 0; }
    }
    @keyframes packet4 {
      0%   { transform: translate(860px, 140px); opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translate(1060px, 140px); opacity: 0; }
    }
    @keyframes nodePulse {
      0%   { transform: scale(1); filter: drop-shadow(0 0 2px rgba(131, 110, 249, 0.2)); }
      100% { transform: scale(1.02); filter: drop-shadow(0 0 8px rgba(131, 110, 249, 0.6)); }
    }
  </style>

  <!-- Container Box -->
  <rect width="1200" height="380" rx="16" fill="url(#archBg)" stroke="#26174a" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(50, 44)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#836EF9" letter-spacing="2">
      DATA FLOW &amp; PROTOCOL LIFECYCLE
    </text>
    <text y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">
      Zero-Knowledge Evidence-Verification Pipeline
    </text>
  </g>

  <!-- Flow Connector Pipes (Background) -->
  <g stroke-width="3">
    <!-- Connecting Backbone -->
    <line x1="150" y1="160" x2="1050" y2="160" stroke="#1d1338" stroke-width="6" />
    <line x1="150" y1="160" x2="1050" y2="160" stroke="url(#pipeGrad)" class="track-line" opacity="0.75" />
  </g>

  <!-- Animated Moving Energy Packets -->
  <g>
    <!-- Packet 1: Claim -> Hash -->
    <g class="energy-packet-1">
      <circle cx="0" cy="20" r="5" fill="#00F2FE" filter="url(#neonGlow)" />
    </g>
    <!-- Packet 2: Hash -> Verifier -->
    <g class="energy-packet-2">
      <circle cx="0" cy="20" r="5" fill="#836EF9" filter="url(#neonGlow)" />
    </g>
    <!-- Packet 3: Verifier -> On-Chain -->
    <g class="energy-packet-3">
      <circle cx="0" cy="20" r="5" fill="#10B981" filter="url(#neonGlow)" />
    </g>
    <!-- Packet 4: On-Chain -> Audit -->
    <g class="energy-packet-4">
      <circle cx="0" cy="20" r="5" fill="#38BDF8" filter="url(#neonGlow)" />
    </g>
  </g>

  <!-- 5 PIPELINE STAGE CARDS -->

  <!-- STAGE 1: WORK / CLAIM -->
  <g transform="translate(50, 100)">
    <rect width="200" height="220" rx="12" fill="url(#nodeGrad1)" stroke="#00F2FE" stroke-width="1.2" opacity="0.95" />
    <circle cx="36" cy="36" r="16" fill="#0c2340" />
    <!-- Terminal / Code Icon -->
    <path d="M28 32l6 4-6 4M38 40h6" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="62" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="1">STEP 01</text>
    <text x="62" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">WORK / CLAIM</text>
    <line x1="20" y1="70" x2="180" y2="70" stroke="#1e293b" stroke-width="1" />
    
    <text x="20" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Subject Submits:</text>
    <text x="20" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Contract Deployment</text>
    <text x="20" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Challenge Milestone</text>
    <text x="20" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Open-Source PR / Patch</text>

    <!-- State Tag -->
    <rect x="20" y="174" width="86" height="24" rx="6" fill="#0e243d" stroke="#00F2FE" stroke-width="1" />
    <text x="32" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#00F2FE">UNREGISTERED</text>
  </g>

  <!-- STAGE 2: CANONICAL EVIDENCE -->
  <g transform="translate(275, 100)">
    <rect width="200" height="220" rx="12" fill="url(#nodeGrad2)" stroke="#836EF9" stroke-width="1.2" opacity="0.95" />
    <circle cx="36" cy="36" r="16" fill="#240c47" />
    <!-- Fingerprint / Hash Icon -->
    <path d="M30 36a6 6 0 0112 0c0 4-3 6-3 8m-6-16a10 10 0 0120 0" stroke="#836EF9" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <text x="62" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#A78BFA" letter-spacing="1">STEP 02</text>
    <text x="62" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">EVIDENCE HASH</text>
    <line x1="20" y1="70" x2="180" y2="70" stroke="#2a174d" stroke-width="1" />

    <text x="20" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Canonical Manifest:</text>
    <text x="20" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• SHA-256 Digest</text>
    <text x="20" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Web Crypto Standard</text>
    <text x="20" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Tamper Resistance</text>

    <!-- State Tag -->
    <rect x="20" y="174" width="70" height="24" rx="6" fill="#25124a" stroke="#836EF9" stroke-width="1" />
    <text x="34" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#A78BFA">PENDING</text>
  </g>

  <!-- STAGE 3: AUTHORIZED VERIFIER -->
  <g transform="translate(500, 100)">
    <rect width="200" height="220" rx="12" fill="url(#nodeGrad3)" stroke="#10B981" stroke-width="1.2" opacity="0.95" />
    <circle cx="36" cy="36" r="16" fill="#042a1f" />
    <!-- Verifier Badge Icon -->
    <path d="M36 26l7 4v6c0 5-3.5 9-7 10-3.5-1-7-5-7-10v-6l7-4z" stroke="#10B981" stroke-width="1.8" fill="none" />
    <text x="62" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34D399" letter-spacing="1">STEP 03</text>
    <text x="62" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">VERIFIER REVIEW</text>
    <line x1="20" y1="70" x2="180" y2="70" stroke="#064e3b" stroke-width="1" />

    <text x="20" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Authority Validation:</text>
    <text x="20" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Role Gated (isVerifier)</text>
    <text x="20" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Mandatory Justification</text>
    <text x="20" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Approve or Reject</text>

    <!-- State Tag -->
    <rect x="20" y="174" width="76" height="24" rx="6" fill="#042a1f" stroke="#10B981" stroke-width="1" />
    <text x="30" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#10B981">ROLE CHECK</text>
  </g>

  <!-- STAGE 4: ON-CHAIN PROOF (MONAD) -->
  <g transform="translate(725, 100)">
    <rect width="200" height="220" rx="12" fill="url(#nodeGrad4)" stroke="#A78BFA" stroke-width="1.2" opacity="0.95" />
    <circle cx="36" cy="36" r="16" fill="#2d1259" />
    <!-- Cube / Monad Block Icon -->
    <path d="M36 28l9 5v10l-9 5-9-5V33zM36 28v20M45 33l-9 5-9-5" stroke="#A78BFA" stroke-width="1.6" fill="none" />
    <text x="62" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#C4B5FD" letter-spacing="1">STEP 04</text>
    <text x="62" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">ON-CHAIN PROOF</text>
    <line x1="20" y1="70" x2="180" y2="70" stroke="#3b156b" stroke-width="1" />

    <text x="20" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Monad Registry:</text>
    <text x="20" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• ProofOfWorkRegistry</text>
    <text x="20" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Real Tx Receipt &amp; Block</text>
    <text x="20" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• State Invariant Preserved</text>

    <!-- State Tag -->
    <rect x="20" y="174" width="70" height="24" rx="6" fill="#301163" stroke="#A78BFA" stroke-width="1" />
    <text x="31" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#C4B5FD">VERIFIED</text>
  </g>

  <!-- STAGE 5: PUBLIC AUDIT -->
  <g transform="translate(950, 100)">
    <rect width="200" height="220" rx="12" fill="url(#nodeGrad5)" stroke="#38BDF8" stroke-width="1.2" opacity="0.95" />
    <circle cx="36" cy="36" r="16" fill="#082b42" />
    <!-- Eye / Inspector Icon -->
    <circle cx="36" cy="36" r="5" stroke="#38BDF8" stroke-width="2" fill="none" />
    <path d="M26 36s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z" stroke="#38BDF8" stroke-width="1.8" fill="none" />
    <text x="62" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#7DD3FC" letter-spacing="1">STEP 05</text>
    <text x="62" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">PUBLIC AUDIT</text>
    <line x1="20" y1="70" x2="180" y2="70" stroke="#0e3a54" stroke-width="1" />

    <text x="20" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Zero Wallet Required:</text>
    <text x="20" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Direct Monad Explorer</text>
    <text x="20" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Client-side SHA Matching</text>
    <text x="20" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Historical Non-Repudiation</text>

    <!-- State Tag -->
    <rect x="20" y="174" width="76" height="24" rx="6" fill="#0a2e45" stroke="#38BDF8" stroke-width="1" />
    <text x="32" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38BDF8">AUDITED</text>
  </g>
</svg>
