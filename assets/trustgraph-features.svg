<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="featuresBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080314" />
      <stop offset="50%" stop-color="#100726" />
      <stop offset="100%" stop-color="#070312" />
    </linearGradient>

    <!-- Card Background Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181236" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0e0a24" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1442" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#100826" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c38" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#091124" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17222f" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b1521" stop-opacity="0.9" />
    </linearGradient>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .card-hover {
      transition: all 0.3s ease;
    }
    .card-hover:hover {
      filter: drop-shadow(0 0 10px rgba(131, 110, 249, 0.4));
    }
    .pulse-icon {
      animation: pulseIcon 3s ease-in-out infinite;
    }
    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
  </style>

  <!-- Frame Background -->
  <rect width="1200" height="280" rx="16" fill="url(#featuresBg)" stroke="#221440" stroke-width="1.5" />

  <!-- 4 FEATURE SURFACE CARDS -->

  <!-- CARD 1: TRUST PROFILE -->
  <g class="card-hover" transform="translate(40, 30)">
    <rect width="260" height="220" rx="12" fill="url(#cardGrad1)" stroke="#836EF9" stroke-width="1.2" />
    <!-- Icon Circle -->
    <circle cx="36" cy="38" r="18" fill="#2d1c61" />
    <circle cx="36" cy="32" r="6" stroke="#A78BFA" stroke-width="2" fill="none" />
    <path d="M26 46c0-4 4.5-7 10-7s10 3 10 7" stroke="#A78BFA" stroke-width="2" fill="none" />

    <text x="68" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#A78BFA">SURFACE 01</text>
    <text x="68" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Trust Profile</text>
    <text x="20" y="80" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#818CF8">/profile/:address</text>
    <line x1="20" y1="94" x2="240" y2="94" stroke="#2a1f52" stroke-width="1" />

    <text x="20" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">• Public inspector view</text>
    <text x="20" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">• Deterministic hash match</text>
    <text x="20" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">• Zero arbitrary scores/XP</text>
    <text x="20" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">• Wallet connection optional</text>

    <!-- Tag -->
    <rect x="20" y="196" width="94" height="20" rx="4" fill="#221447" />
    <text x="28" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#A78BFA">PUBLIC VIEW</text>
  </g>

  <!-- CARD 2: ISSUE & SUBMIT -->
  <g class="card-hover" transform="translate(325, 30)">
    <rect width="260" height="220" rx="12" fill="url(#cardGrad2)" stroke="#A0055D" stroke-width="1.2" />
    <!-- Icon Circle -->
    <circle cx="36" cy="38" r="18" fill="#400b2e" />
    <path d="M30 38h12M36 32v12" stroke="#F43F5E" stroke-width="2" stroke-linecap="round" />

    <text x="68" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FB7185">SURFACE 02</text>
    <text x="68" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Work Register</text>
    <text x="20" y="80" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#F43F5E">/submit &amp; /issue</text>
    <line x1="20" y1="94" x2="240" y2="94" stroke="#421334" stroke-width="1" />

    <text x="20" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">• Real-time Web Crypto hash</text>
    <text x="20" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">• Pre-submission ledger check</text>
    <text x="20" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">• Contract deployment verify</text>
    <text x="20" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">• Real Monad testnet tx</text>

    <!-- Tag -->
    <rect x="20" y="196" width="94" height="20" rx="4" fill="#380d28" />
    <text x="28" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#FB7185">DEVELOPER</text>
  </g>

  <!-- CARD 3: TRUST GRAPH -->
  <g class="card-hover" transform="translate(610, 30)">
    <rect width="260" height="220" rx="12" fill="url(#cardGrad3)" stroke="#00F2FE" stroke-width="1.2" />
    <!-- Icon Circle -->
    <circle cx="36" cy="38" r="18" fill="#082b42" />
    <!-- Connected graph nodes icon -->
    <circle cx="30" cy="34" r="3" fill="#00F2FE" />
    <circle cx="43" cy="31" r="3" fill="#00F2FE" />
    <circle cx="36" cy="45" r="3" fill="#00F2FE" />
    <line x1="30" y1="34" x2="43" y2="31" stroke="#00F2FE" stroke-width="1.5" />
    <line x1="30" y1="34" x2="36" y2="45" stroke="#00F2FE" stroke-width="1.5" />
    <line x1="43" y1="31" x2="36" y2="45" stroke="#00F2FE" stroke-width="1.5" />

    <text x="68" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">SURFACE 03</text>
    <text x="68" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Interactive Graph</text>
    <text x="20" y="80" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#00F2FE">/graph/:address</text>
    <line x1="20" y1="94" x2="240" y2="94" stroke="#123b59" stroke-width="1" />

    <text x="20" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">• Force-directed node tree</text>
    <text x="20" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">• Subject → Work → Verifier</text>
    <text x="20" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">• Interactive inspector panel</text>
    <text x="20" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">• Zoom, filter, and center</text>

    <!-- Tag -->
    <rect x="20" y="196" width="94" height="20" rx="4" fill="#0b2c3d" />
    <text x="28" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38BDF8">KNOWLEDGE</text>
  </g>

  <!-- CARD 4: AUDIT & VERIFY -->
  <g class="card-hover" transform="translate(895, 30)">
    <rect width="260" height="220" rx="12" fill="url(#cardGrad4)" stroke="#10B981" stroke-width="1.2" />
    <!-- Icon Circle -->
    <circle cx="36" cy="38" r="18" fill="#06382a" />
    <path d="M30 38l4 4 8-8" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <text x="68" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34D399">SURFACE 04</text>
    <text x="68" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Verifier Queue</text>
    <text x="20" y="80" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#10B981">/verify &amp; /verify/:id</text>
    <line x1="20" y1="94" x2="240" y2="94" stroke="#103c31" stroke-width="1" />

    <text x="20" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">• Authorized verifier gate</text>
    <text x="20" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">• 7-point integrity checklist</text>
    <text x="20" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">• Mandatory revocation note</text>
    <text x="20" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">• Preserves historical proof</text>

    <!-- Tag -->
    <rect x="20" y="196" width="94" height="20" rx="4" fill="#082b21" />
    <text x="28" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34D399">GOVERNANCE</text>
  </g>
</svg>
